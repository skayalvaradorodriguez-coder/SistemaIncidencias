# ============================================================
# Balanceo de carga (escalamiento básico) entre las 2 instancias
# del backend Laravel. Round-robin: cada petición PHP se reparte
# alternadamente entre "backend" y "backend2".
# ============================================================
upstream php_backend {
    server backend:9000  max_fails=3 fail_timeout=10s;
    server backend2:9000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    index index.php index.html;
    root /var/www/html/public;

    # Oculta la versión de Nginx y agrega cabeceras de seguridad
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ===== Optimización: compresión gzip de las respuestas =====
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_keep_conn on;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}